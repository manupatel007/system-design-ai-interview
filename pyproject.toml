[project]
name = "voice-interviewer"
version = "0.1.0"
description = "Local-first realtime voice pipeline scaffold for an AI system-design interviewer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "faster-whisper>=1.2,<2",
    "httpx>=0.28,<1",
    "kokoro-onnx>=0.5,<0.6",
    "numpy>=2.1,<3",
    "onnxruntime>=1.22,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
voice-interviewer = "voice_interviewer.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_interviewer"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
